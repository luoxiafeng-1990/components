# ============================================================
# log4cplus 日志配置文件
# ============================================================
# 
# 修改后无需重新编译，直接运行程序即可生效！
#
# 日志级别（从低到高）：
#   TRACE   - 最详细的跟踪信息（调试专用）
#   DEBUG   - 详细的调试信息
#   INFO    - 重要的业务流程信息
#   WARN    - 警告信息（不影响正常运行）
#   ERROR   - 错误信息（可能影响功能）
#   FATAL   - 致命错误（导致程序崩溃）
#
# 层次化 Logger 说明：
#   - 父模块设置会继承给子模块（除非子模块单独设置）
#   - 例如：components.Worker=WARN 会影响所有 Worker.* 子模块
#
# ============================================================

# ------------------------------------------------------------
# 根 Logger（默认级别）
# ------------------------------------------------------------
log4cplus.rootLogger=INFO, CONSOLE

# ------------------------------------------------------------
# Console Appender 配置（控制台输出）
# ------------------------------------------------------------
log4cplus.appender.CONSOLE=log4cplus::ConsoleAppender
log4cplus.appender.CONSOLE.layout=log4cplus::PatternLayout
log4cplus.appender.CONSOLE.layout.ConversionPattern=[%D{%Y-%m-%d %H:%M:%S.%q}] [%c] [%-5p] %m%n

# ------------------------------------------------------------
# 可选：文件输出（取消注释启用）
# ------------------------------------------------------------
# log4cplus.rootLogger=WARN, CONSOLE, FILE
# log4cplus.appender.FILE=log4cplus::RollingFileAppender
# log4cplus.appender.FILE.File=/var/log/components.log
# log4cplus.appender.FILE.MaxFileSize=10MB
# log4cplus.appender.FILE.MaxBackupIndex=5
# log4cplus.appender.FILE.layout=log4cplus::PatternLayout
# log4cplus.appender.FILE.layout.ConversionPattern=[%D{%Y-%m-%d %H:%M:%S.%q}] [%c] [%-5p] %m%n

# ============================================================
# 各模块日志级别配置（按需调整）
# ============================================================

# ------------------------------------------------------------
# 测试框架
# ------------------------------------------------------------
log4cplus.logger.components.Test=WARN

# ------------------------------------------------------------
# ProductionLine 模块
# ------------------------------------------------------------
log4cplus.logger.components.MultiWorker=WARN
log4cplus.logger.components.VideoLine=WARN

# ------------------------------------------------------------
# Buffer 相关模块
# ------------------------------------------------------------
log4cplus.logger.components.BufferPool=WARN
log4cplus.logger.components.EncodedPacketSourceFromBuffer=WARN
log4cplus.logger.components.BufferWriter=WARN
log4cplus.logger.components.BufferComparator=WARN
log4cplus.logger.components.BufferPool.Registry=WARN

# ------------------------------------------------------------
# Connector 模块
# ------------------------------------------------------------
log4cplus.logger.components.Connector=WARN

# ------------------------------------------------------------
# Worker 模块（层次化）
# ------------------------------------------------------------
# 父模块（会继承给所有 Worker.* 子模块）
log4cplus.logger.components.Worker=WARN

# Worker 子模块（可以覆盖父模块设置）
log4cplus.logger.components.Worker.VideoFile=WARN
log4cplus.logger.components.Worker.Rtsp=WARN
log4cplus.logger.components.Worker.Recorder=WARN
log4cplus.logger.components.Worker.Factory=WARN
log4cplus.logger.components.Worker.Facade=WARN

# ------------------------------------------------------------
# Allocator 模块（层次化）
# ------------------------------------------------------------
# 父模块（会继承给所有 Allocator.* 子模块）
log4cplus.logger.components.Allocator=WARN

# Allocator 子模块
log4cplus.logger.components.Allocator.AVFrame=WARN
log4cplus.logger.components.Allocator.Framebuffer=WARN
log4cplus.logger.components.Allocator.Normal=WARN
log4cplus.logger.components.Allocator.Factory=WARN
log4cplus.logger.components.Allocator.Facade=WARN

# ------------------------------------------------------------
# DataSource 模块
# ------------------------------------------------------------
log4cplus.logger.components.DataSource.Rtsp=WARN
log4cplus.logger.components.DataSource.File=WARN

# ------------------------------------------------------------
# Display 模块
# ------------------------------------------------------------
log4cplus.logger.components.Display.Framebuffer=WARN
log4cplus.logger.components.Display.SharedContext=WARN

# ------------------------------------------------------------
# Monitor 模块
# ------------------------------------------------------------
log4cplus.logger.components.Monitor.Performance=WARN

# ------------------------------------------------------------
# Utility 模块
# ------------------------------------------------------------
log4cplus.logger.components.Util.Timer=WARN

# ============================================================
# 常见调试场景配置示例
# ============================================================

log4cplus.logger.components.VideoProductionLine=WARN
log4cplus.logger.consumer.BufferConsumerService=WARN
log4cplus.logger.consumer.OpencvConsumer=INFO

# 场景1：调试 RTSP 连接问题
# ------------------------------------------------------------
# log4cplus.logger.components.DataSource.Rtsp=TRACE
# log4cplus.logger.components.Worker.Rtsp=TRACE

# 场景2：调试内存分配问题
# ------------------------------------------------------------
# log4cplus.logger.components.Allocator=WARN
# log4cplus.logger.components.Allocator.AVFrame=TRACE
# log4cplus.logger.components.BufferPool=WARN

# 场景3：调试多 Worker 调度问题
# ------------------------------------------------------------
# log4cplus.logger.components.MultiWorker=TRACE
# log4cplus.logger.components.Connector=WARN

# 场景4：只看关键信息（生产环境）
# ------------------------------------------------------------
# log4cplus.rootLogger=WARN, CONSOLE
# log4cplus.logger.components=WARN

# 场景5：完全静默（只输出错误）
# ------------------------------------------------------------
# log4cplus.rootLogger=ERROR, CONSOLE
# log4cplus.logger.components=ERROR

# ============================================================
# 配置完成后，直接运行程序即可生效！
# ============================================================
