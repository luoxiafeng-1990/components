<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Display 厂商扩展 — 矢量动画演示</title>
  <style>
    :root {
      --bg0: #070b12;
      --bg1: #0d1525;
      --text: #e8f0ff;
      --dim: #5c6b8a;
      --pro: #00d68f;
      --vo: #ffb547;
      --line: rgba(100, 140, 255, 0.45);
      --glow: rgba(80, 160, 255, 0.9);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
      background: radial-gradient(1200px 800px at 50% -10%, #1a2744 0%, var(--bg0) 55%);
      color: var(--text);
      overflow-x: hidden;
    }
    header {
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(20,30,55,0.9), transparent);
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .tabs {
      display: flex;
      gap: 0.35rem;
    }
    .tabs button {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
    }
    .tabs button.on {
      background: linear-gradient(135deg, #2b5cff, #6b8cff);
      border-color: transparent;
      box-shadow: 0 0 20px rgba(60, 120, 255, 0.35);
    }
    .toolbar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toolbar button.icon {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }
    .toolbar button.icon:hover { border-color: var(--glow); }
    .stage-wrap {
      padding: 0.5rem 1rem 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .stage {
      width: 100%;
      border-radius: 16px;
      background: linear-gradient(145deg, var(--bg1), #060a10);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 24px 80px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .stage svg { display: block; width: 100%; height: auto; }
    .panel { display: none; }
    .panel.show { display: block; }
    .caption {
      text-align: center;
      font-size: 0.8rem;
      color: var(--dim);
      min-height: 1.4rem;
      margin-top: 0.5rem;
    }
    .caption strong { color: #9db7ff; font-weight: 600; }
    /* SVG 内文字选中 */
    svg text { user-select: none; }
  </style>
</head>
<body>
  <header>
    <h1>Display 厂商扩展 · 可视化</h1>
    <nav class="tabs" aria-label="视图">
      <button type="button" class="on" data-panel="flow">调用链动画</button>
      <button type="button" data-panel="class">类图</button>
    </nav>
    <div class="toolbar">
      <button type="button" class="icon" id="btnPlay" title="播放/暂停">▶</button>
    </div>
  </header>

  <div class="stage-wrap">
    <div class="stage">
      <!-- ========== 面板 A：调用链（矢量 + 动画） ========== -->
      <div id="panel-flow" class="panel show">
        <svg id="svg-flow" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3d5cff" stop-opacity="0.2"/>
              <stop offset="50%" stop-color="#7cadff" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#3d5cff" stop-opacity="0.2"/>
            </linearGradient>
            <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
              <path d="M0,0 L0,6 L9,3 z" fill="#6b8cff"/>
            </marker>
            <!-- 粒子沿路径运动：虚线流动 -->
            <path id="trace-main" fill="none" stroke="none"
              d="M 118 118 L 248 118 L 378 118 L 508 118 L 640 118 L 772 118 L 772 248 L 640 248 L 508 248 L 378 352 L 248 352 L 118 352 L 118 248 Z"/>
            <!-- 实际可见主路径（简化折线） -->
            <path id="path-journey" fill="none"
              d="M 100 96
                 C 160 96, 200 96, 260 96
                 L 340 96
                 L 420 96
                 L 520 96
                 L 620 96
                 L 720 96
                 L 860 96
                 L 900 96
                 L 920 140
                 L 920 200
                 L 860 240
                 L 720 240
                 L 580 240
                 L 440 300
                 L 300 360
                 L 160 400
                 L 100 400
                 L 80 340
                 L 80 260
                 L 100 200
                 L 100 140 Z"/>
          </defs>

          <!-- 分层背景带 -->
          <rect x="20" y="28" width="960" height="72" rx="12" fill="rgba(40,80,200,0.08)" stroke="rgba(120,160,255,0.15)"/>
          <text x="40" y="52" fill="#7a9fff" font-size="11" font-weight="600">用户层</text>
          <rect x="20" y="118" width="960" height="88" rx="12" fill="rgba(0,180,140,0.06)" stroke="rgba(0,214,143,0.12)"/>
          <text x="40" y="142" fill="#4dffc4" font-size="11" font-weight="600">测试入口 · qa_cases</text>
          <rect x="20" y="228" width="960" height="112" rx="12" fill="rgba(255,160,60,0.06)" stroke="rgba(255,181,71,0.15)"/>
          <text x="40" y="252" fill="#ffcc80" font-size="11" font-weight="600">配置对象 · WorkerConfig</text>
          <rect x="20" y="358" width="960" height="182" rx="12" fill="rgba(180,100,255,0.06)" stroke="rgba(200,150,255,0.12)"/>
          <text x="40" y="382" fill="#d4b5ff" font-size="11" font-weight="600">运行时 · 消费与设备</text>

          <!-- 流动管线（底层） -->
          <path id="visible-path" fill="none" stroke="url(#pipeGrad)" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"
            d="M 100 72 L 260 72 L 420 72 L 580 72 L 740 72 L 900 72
               L 940 110 L 940 200 L 900 268 L 740 268 L 560 268 L 400 328 L 240 388 L 100 388 L 62 340 L 62 250 L 100 180 L 100 72 Z"/>
          <path fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="8 14"
            d="M 100 72 L 260 72 L 420 72 L 580 72 L 740 72 L 900 72
               L 940 110 L 940 200 L 900 268 L 740 268 L 560 268 L 400 328 L 240 388 L 100 388 L 62 340 L 62 250 L 100 180 L 100 72 Z">
            <animate attributeName="stroke-dashoffset" from="0" to="220" dur="2.5s" repeatCount="indefinite"/>
          </path>

          <!-- 节点 -->
          <g id="nodes-flow">
            <g class="fnode" data-i="0" transform="translate(70,48)">
              <rect x="-50" y="-28" width="100" height="56" rx="10" fill="#152238" stroke="#4d7cff" stroke-width="1.5"/>
              <text x="0" y="-6" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">终端</text>
              <text x="0" y="12" text-anchor="middle" fill="#8ab4ff" font-size="9">CLI 输入</text>
            </g>
            <g class="fnode" data-i="1" transform="translate(260,72)">
              <rect x="-55" y="-24" width="110" height="48" rx="10" fill="#152238" stroke="#3dd9a0" stroke-width="1.5"/>
              <text x="0" y="2" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">CLI11::parse</text>
            </g>
            <g class="fnode" data-i="2" transform="translate(420,72)">
              <rect x="-62" y="-28" width="124" height="56" rx="10" fill="#152238" stroke="#ffb547" stroke-width="1.5"/>
              <text x="0" y="-8" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">DisplayPlugin</text>
              <text x="0" y="10" text-anchor="middle" fill="#ffcc80" font-size="8">--vendor 默认 tacopro</text>
            </g>
            <g class="fnode" data-i="3" transform="translate(580,72)">
              <rect x="-58" y="-24" width="116" height="48" rx="10" fill="#152238" stroke="#7cadff" stroke-width="1.5"/>
              <text x="0" y="2" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">applyTo</text>
            </g>
            <g class="fnode" data-i="4" transform="translate(740,72)">
              <rect x="-70" y="-30" width="140" height="60" rx="10" fill="#1a1f35" stroke="#a78bfa" stroke-width="1.5"/>
              <text x="0" y="-10" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">DisplayConsumerConfig</text>
              <text x="0" y="6" text-anchor="middle" fill="#b4c8ff" font-size="8">enable · device_id</text>
              <text x="0" y="18" text-anchor="middle" fill="#7dffce" font-size="8">vendor → Extension</text>
            </g>
            <g class="fnode" data-i="5" transform="translate(900,72)">
              <rect x="-52" y="-22" width="104" height="44" rx="8" fill="#0d2818" stroke="#00d68f" stroke-width="1.5"/>
              <text x="0" y="4" text-anchor="middle" fill="#7dffc4" font-size="9" font-weight="700">TacoPro</text>
            </g>
            <g class="fnode" data-i="6" transform="translate(900,160)">
              <rect x="-52" y="-22" width="104" height="44" rx="8" fill="#2a1f0d" stroke="#ffb547" stroke-width="1.5"/>
              <text x="0" y="4" text-anchor="middle" fill="#ffe0a8" font-size="9" font-weight="700">Taco</text>
            </g>

            <g class="fnode" data-i="7" transform="translate(740,268)">
              <rect x="-68" y="-26" width="136" height="52" rx="10" fill="#152238" stroke="#6b8cff" stroke-width="1.5"/>
              <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">ExecuteMode</text>
            </g>
            <g class="fnode" data-i="8" transform="translate(560,268)">
              <rect x="-78" y="-26" width="156" height="52" rx="10" fill="#152238" stroke="#6b8cff" stroke-width="1.5"/>
              <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">BufferConsumerService</text>
            </g>
            <g class="fnode" data-i="9" transform="translate(400,328)">
              <rect x="-72" y="-26" width="144" height="52" rx="10" fill="#152238" stroke="#c084fc" stroke-width="1.5"/>
              <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">DisplayConsumer</text>
            </g>
            <g class="fnode" data-i="10" transform="translate(240,388)">
              <rect x="-80" y="-26" width="160" height="52" rx="10" fill="#152238" stroke="#f472b6" stroke-width="1.5"/>
              <text x="0" y="-2" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">DisplayDeviceFactory</text>
              <text x="0" y="12" text-anchor="middle" fill="#fbcfe8" font-size="7">kind() → 设备</text>
            </g>
            <g class="fnode" data-i="11" transform="translate(100,388)">
              <rect x="-70" y="-30" width="140" height="60" rx="12" fill="#1a1530" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>
              <text x="0" y="-6" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">IDisplayDevice</text>
              <text x="0" y="10" text-anchor="middle" fill="#7dd3fc" font-size="8">initialize · displayBuffer</text>
            </g>
          </g>

          <!-- 运动粒子 -->
          <circle r="7" fill="#7cadff" filter="url(#softGlow)">
            <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
              <mpath href="#mpath-loop"/>
            </animateMotion>
          </circle>
          <circle r="4" fill="#ffffff" opacity="0.9">
            <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
              <mpath href="#mpath-loop"/>
            </animateMotion>
          </circle>

          <path id="mpath-loop" fill="none"
            d="M 100 72 L 260 72 L 420 72 L 580 72 L 740 72 L 900 72
               L 940 110 L 940 200 L 900 268 L 740 268 L 560 268 L 400 328 L 240 388 L 100 388 L 62 340 L 62 250 L 100 180 L 100 72"/>

          <!-- 箭头连接（装饰） -->
          <g stroke="rgba(120,160,255,0.35)" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
            <path d="M 130 72 L 200 72"/>
            <path d="M 320 72 L 360 72"/>
            <path d="M 480 72 L 520 72"/>
            <path d="M 640 72 L 680 72"/>
            <path d="M 810 72 L 850 72"/>
          </g>
        </svg>
      </div>

      <!-- ========== 面板 B：类图（矢量） ========== -->
      <div id="panel-class" class="panel">
        <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
              <path d="M0,0 L10,4 L0,8 Z" fill="#8b9dc9"/>
            </marker>
            <marker id="arr-hollow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
              <path d="M0,0 L12,6 L0,12 Z" fill="none" stroke="#8b9dc9" stroke-width="1.2"/>
            </marker>
          </defs>
          <text x="500" y="36" text-anchor="middle" fill="#9db7ff" font-size="14" font-weight="700">配置侧类关系（目标架构）</text>

          <!-- 抽象基类 -->
          <g transform="translate(360, 70)">
            <rect x="0" y="0" width="280" height="72" rx="8" fill="#121a2e" stroke="#6b8cff" stroke-width="2" stroke-dasharray="6 4"/>
            <text x="140" y="28" text-anchor="middle" fill="#a5bfff" font-size="11" font-style="italic">&lt;&lt;interface&gt;&gt;</text>
            <text x="140" y="48" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">IDisplayVendorExtension</text>
            <text x="140" y="64" text-anchor="middle" fill="#8ab4ff" font-size="9">+ kind()  clone()  validate()</text>
          </g>

          <!-- 子类 tacopro -->
          <g transform="translate(120, 240)">
            <rect x="0" y="0" width="220" height="100" rx="10" fill="#0a241c" stroke="#00d68f" stroke-width="2">
              <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
            </rect>
            <text x="110" y="28" text-anchor="middle" fill="#7dffc4" font-size="12" font-weight="700">TacoProDisplayExtension</text>
            <text x="110" y="50" text-anchor="middle" fill="#9ee9c9" font-size="9">SharedDisplay 多通道显示参数</text>
            <text x="110" y="68" text-anchor="middle" fill="#6aa88a" font-size="8">width · height · bpp · …</text>
            <text x="110" y="86" text-anchor="middle" fill="#5a9880" font-size="8">kind() = "tacopro"</text>
          </g>

          <!-- 子类 taco -->
          <g transform="translate(660, 240)">
            <rect x="0" y="0" width="220" height="100" rx="10" fill="#2a1a0a" stroke="#ffb547" stroke-width="2">
              <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
            </rect>
            <text x="110" y="28" text-anchor="middle" fill="#ffd699" font-size="12" font-weight="700">TacoDisplayExtension</text>
            <text x="110" y="50" text-anchor="middle" fill="#e8c49a" font-size="9">Taco 视频输出管道参数</text>
            <text x="110" y="68" text-anchor="middle" fill="#c4a574" font-size="8">fps · frame_w/h · osd · …</text>
            <text x="110" y="86" text-anchor="middle" fill="#b89560" font-size="8">kind() = "taco"</text>
          </g>

          <!-- 继承三角 -->
          <path d="M 500 150 L 500 175 L 430 210" fill="none" stroke="#8b9dc9" stroke-width="1.5" marker-end="url(#arr)"/>
          <path d="M 500 150 L 500 175 L 570 210" fill="none" stroke="#8b9dc9" stroke-width="1.5" marker-end="url(#arr)"/>
          <text x="380" y="200" fill="#6b7a99" font-size="9">extends</text>
          <text x="585" y="200" fill="#6b7a99" font-size="9">extends</text>

          <!-- DisplayConsumerConfig -->
          <g transform="translate(320, 380)">
            <rect x="0" y="0" width="360" height="88" rx="10" fill="#15182a" stroke="#a78bfa" stroke-width="2"/>
            <text x="180" y="30" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">DisplayConsumerConfig</text>
            <text x="180" y="52" text-anchor="middle" fill="#c4b5fd" font-size="10">+ enable  device_id</text>
            <text x="180" y="72" text-anchor="middle" fill="#9db7ff" font-size="10">+ vendor : unique_ptr&lt;IDisplayVendorExtension&gt;</text>
          </g>

          <!-- 组合关联 -->
          <path d="M 500 380 L 500 330 L 500 142" fill="none" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arr-hollow)"/>
          <text x="520" y="300" fill="#d8cbff" font-size="10" font-weight="600">owns ▷</text>

          <text x="500" y="505" text-anchor="middle" fill="#5c6b8a" font-size="10">拷贝 WorkerConfig 时 vendor→clone() 深拷贝扩展对象</text>
        </svg>
      </div>
    </div>
    <p class="caption" id="cap">提示：顶部切换「类图」查看 UML 关系；双圆点沿环路运动表示<strong>一次完整请求/帧管线</strong>。</p>
  </div>

  <script>
    (function () {
      const panels = { flow: document.getElementById("panel-flow"), class: document.getElementById("panel-class") };
      const tabs = document.querySelectorAll(".tabs button");
      const cap = document.getElementById("cap");
      const steps = [
        "用户在终端输入命令（含 display，可省略 --vendor，默认 tacopro）",
        "CLI11 解析参数，写入各 Plugin 成员",
        "DisplayPlugin 读取 --vendor，准备对应 Extension",
        "applyTo：写入 consumer_type.display.enable 与 vendor",
        "WorkerConfig 持有 DisplayConsumerConfig + 具体 Extension",
        "选中 tacopro(默认)：绿色扩展；选中 taco：橙色扩展",
        "ExecuteMode 驱动整条解码/消费管线",
        "BufferConsumerService 创建 DisplayConsumer",
        "DisplayConsumer::initialize 调用工厂",
        "DisplayDeviceFactory 根据 kind() 创建具体 IDisplayDevice",
        "设备 initialize，进入帧循环",
        "每帧 displayBuffer — 完成闭环"
      ];
      let idx = 0;
      let playing = false;
      let timer = null;
      const nodes = () => document.querySelectorAll("#svg-flow .fnode");

      function setTab(name) {
        tabs.forEach((b) => b.classList.toggle("on", b.dataset.panel === name));
        Object.keys(panels).forEach((k) => panels[k].classList.toggle("show", k === name));
        cap.textContent = name === "class"
          ? "类图：组合 + 继承；子类边框有呼吸灯动画。"
          : "";
      }
      tabs.forEach((b) => b.addEventListener("click", () => setTab(b.dataset.panel)));

      function paintFlow() {
        const n = nodes();
        n.forEach((el, i) => {
          const on = playing && i === idx;
          const rect = el.querySelector("rect");
          if (!rect) return;
          const isDev = el.querySelector("text").textContent.includes("IDisplayDevice");
          if (on) {
            rect.setAttribute("stroke-width", "3");
            rect.setAttribute("filter", "url(#softGlow)");
            el.style.opacity = "1";
          } else {
            rect.setAttribute("stroke-width", isDev ? "2" : "1.5");
            if (isDev) rect.setAttribute("filter", "url(#softGlow)");
            else rect.removeAttribute("filter");
            el.style.opacity = playing ? "0.42" : "1";
          }
        });
        if (!playing) {
          nodes().forEach((el) => {
            el.style.opacity = "1";
            const rect = el.querySelector("rect");
            const dev = el.querySelector("text").textContent.includes("IDisplayDevice");
            if (rect && !dev) rect.removeAttribute("filter");
            if (rect && dev) rect.setAttribute("filter", "url(#softGlow)");
          });
        }
        if (panels.flow.classList.contains("show")) {
          cap.innerHTML = playing
            ? "<strong>步骤 " + (idx + 1) + "/" + steps.length + "</strong> — " + steps[idx]
            : "点击 ▶ 按顺序高亮节点（与粒子运动同步节奏）";
        }
      }

      function tick() {
        idx = (idx + 1) % steps.length;
        paintFlow();
      }

      document.getElementById("btnPlay").addEventListener("click", () => {
        playing = !playing;
        document.getElementById("btnPlay").textContent = playing ? "⏸" : "▶";
        if (playing) {
          if (!panels.flow.classList.contains("show")) setTab("flow");
          timer = setInterval(tick, 1200);
          paintFlow();
        } else {
          clearInterval(timer);
          timer = null;
          paintFlow();
        }
      });

      // 初始：类图子类轻微脉冲已有 SVG animate；流程图节点复位
      paintFlow();
    })();
  </script>
</body>
</html>
